[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reward-shaping-for-bioprocess-feeding"
version = "0.1.0"
description = "Summer-school exercise: design a reward function that reproduces an expert's ranking of fed-batch E. coli cultivations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Christoph Lange", email = "christoph.lange@tu-berlin.de" }]
dependencies = [
    "numpy",
    "scipy>=1.10",
    "matplotlib",
    "jupyter",
    "requests",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
